name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze ve formatu SemVer, napriklad 1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT: src/AppLauncher/AppLauncher/AppLauncher.csproj
  TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
  PACK_ID: AppLauncher
  VPK_VERSION: 1.2.0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Verze '$version' neni platny SemVer. Ocekavam MAJOR.MINOR.PATCH, napriklad 1.0.0."
          }
          $tag = "v$version"
          if (git ls-remote --tags origin "refs/tags/$tag") {
            throw "Tag $tag uz existuje. Zvol vyssi verzi."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ($version -match '-') { "pre=true" >> $env:GITHUB_OUTPUT } else { "pre=false" >> $env:GITHUB_OUTPUT }

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -f ${{ env.TARGET_FRAMEWORK }}
          -r win-x64
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.value }}
          -p:UpdateFeedUrl=https://github.com/${{ github.repository }}
          -o publish

      - name: Download previous releases
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o releases

      - name: Pack
        run: >
          vpk pack
          -u ${{ env.PACK_ID }}
          -v ${{ steps.version.outputs.value }}
          -p publish
          -e AppLauncher.exe
          --packTitle AppLauncher
          -o releases

      - name: Upload to GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ steps.version.outputs.tag }}
          --releaseName ${{ steps.version.outputs.value }}
          --targetCommitish ${{ github.sha }}
          --publish
          ${{ steps.version.outputs.pre == 'true' && '--pre' || '' }}
          -o releases
